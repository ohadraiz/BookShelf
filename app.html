<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ארון הספרים שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--bg:#f6f1e9;--panel:#fffdf9;--ink:#2b2420;--muted:#76695e;--line:#e4d9cb;--soft:#f8f2e9;--accent:#8c3b2a;--bar:#a0483a;--warn:#e8a21c;--gold:#e9b23a;--chip:#f1e9dd}
body.dark{--bg:#1b1612;--panel:#26201b;--ink:#f1e8dc;--muted:#b3a596;--line:#3e342b;--soft:#2f2822;--accent:#c4614a;--bar:#d07a62;--chip:#332b24}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:15px;transition:background .3s}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
.row{display:flex;align-items:center;gap:8px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.row+.row{margin-top:8px;flex-wrap:nowrap}
.row+.row>button,.menuwrap>button{padding:8px 11px;white-space:nowrap}
h1{font-family:"Frank Ruhl Libre",serif;font-size:24px;margin:0;flex:1 1 auto;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#3d8a3a;display:inline-block;transition:background .2s}
.dot.busy{background:var(--warn)}.dot.err{background:#c0442f}.dot.off{background:#999}
.savetxt{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1 1 180px;min-width:0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:transform .1s,background .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.fun{background:linear-gradient(135deg,#8c3b2a,#c0662e);border:0;color:#fff}
button.danger{color:#c0442f;border-color:#e6c1ba}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex}.tabs button{border-radius:0;padding:6px 12px}.tabs button:first-child{border-radius:0 8px 8px 0}.tabs button:last-child{border-radius:8px 0 0 8px}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:210px;display:none;z-index:30}
.menu.open{display:block;animation:pop .15s ease-out}
.menu button{display:block;width:100%;text-align:right;border:0;background:none;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
main{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:14px;user-select:none}
.chip b{font-size:17px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{outline:2px solid var(--ink)}
.tagchip{font-size:13px;padding:4px 10px;border-radius:14px;background:var(--chip);border:1px solid var(--line);cursor:pointer}
.tagchip.on{background:var(--ink);color:var(--bg)}
.section-title{font-family:"Frank Ruhl Libre",serif;font-size:19px;margin:8px 0 10px}
.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.card{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.mini{width:36px;height:54px;border-radius:3px;flex:0 0 auto;box-shadow:inset -3px 0 0 rgba(0,0,0,.2);background-size:cover;background-position:center}
.card .t{font-weight:700;font-size:14px;line-height:1.25}
.card .a{color:var(--muted);font-size:12px;margin:2px 0 6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar div{height:100%;background:#2f7fbf;border-radius:3px}
.alert{color:#c0442f;font-size:12px;font-weight:500}
.note{background:#fbefd6;color:#4a3410;border:1px solid #efd9a8;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
body.dark .note{background:#3a2f1c;color:#f3e3c4;border-color:#5a4826}
.empty{color:var(--muted);text-align:center;padding:40px}
/* cabinet */
.cabinet{background:linear-gradient(90deg,#6b4729,#8d6340 2.5%,#8d6340 97.5%,#6b4729);padding:16px 16px 10px;border-radius:10px 10px 4px 4px;box-shadow:0 10px 30px rgba(60,35,15,.3),inset 0 2px 0 rgba(255,255,255,.15);position:relative}
body.dark .cabinet{filter:brightness(.82)}
.cabinet:before{content:"";position:absolute;top:0;left:10px;right:10px;height:8px;background:linear-gradient(#a57a52,#8d6340);border-radius:0 0 4px 4px}
.cabinet-feet{display:flex;justify-content:space-between;padding:0 24px;margin-bottom:22px}
.cabinet-feet i{width:34px;height:12px;background:#5a3b22;border-radius:0 0 6px 6px}
.shelf{margin-bottom:12px}
.shead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 6px 6px}
.plaque{display:inline-flex;gap:8px;align-items:baseline;background:linear-gradient(#e8cf96,#c9a45c);color:#3b2a16;font-size:13px;font-weight:700;padding:2px 12px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.plaque small{font-weight:400;opacity:.8}
.shead button{padding:2px 9px;font-size:12px;background:#f1d58e;color:#3b2a16;border:0}
.rack{display:flex;align-items:flex-end;gap:2px;padding:16px 10px 0;min-height:70px;overflow-x:auto;background:linear-gradient(180deg,#2e1d10,#4a311c 30%,#56391f);border-radius:3px 3px 0 0;box-shadow:inset 0 8px 14px rgba(0,0,0,.45),inset 8px 0 10px rgba(0,0,0,.25),inset -8px 0 10px rgba(0,0,0,.25);scrollbar-width:thin;scrollbar-color:#a57a52 transparent}
.rack .hint{color:rgba(241,213,142,.5);font-size:13px;padding:20px 8px;align-self:center}
.board{height:16px;background:linear-gradient(#b48658,#8d6340 60%,#6b4729);border-radius:0 0 3px 3px;box-shadow:0 5px 6px rgba(0,0,0,.35)}
.spine{flex:0 0 auto;border-radius:3px 3px 1px 1px;color:#fff;writing-mode:vertical-rl;padding:22px 0 26px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;line-height:1.1;overflow:hidden;box-shadow:inset -4px 0 0 rgba(0,0,0,.22),inset 3px 0 0 rgba(255,255,255,.14),2px 0 3px rgba(0,0,0,.4);background-image:linear-gradient(90deg,rgba(0,0,0,.12),rgba(255,255,255,.08) 40%,rgba(0,0,0,.12));transition:transform .18s,opacity .2s;position:relative;border:0;font-family:inherit}
.spine:before,.spine:after{content:"";position:absolute;left:4px;right:4px;height:3px;border-top:1px solid rgba(233,178,58,.75);border-bottom:1px solid rgba(233,178,58,.75)}
.spine:before{top:9px}.spine:after{bottom:15px}
.spine.light:before,.spine.light:after{border-color:rgba(90,60,20,.5)}
.spine:hover,.spine:focus-visible{transform:translateY(-12px);outline:none;z-index:2}
.spine b{font-family:"Frank Ruhl Libre",serif;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:72%}
.spine span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.spine.light{color:#2b2420}
.spine.ghost{opacity:.3}
.spine .rib{position:absolute;bottom:0;left:0;right:0;height:9px}
.spine .flag{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--warn);border:1.5px solid #fff}
.spine .st{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);writing-mode:horizontal-tb;font-size:9px;color:var(--gold);letter-spacing:-1px;text-shadow:0 0 2px #000}
.spine.reading{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.spine.sel{transform:translateY(-16px);outline:3px solid #f1d58e;outline-offset:1px;z-index:3}
.slot{flex:0 0 auto;align-self:stretch;writing-mode:vertical-rl;background:transparent;border:2px dashed rgba(241,213,142,.35);color:rgba(241,213,142,.65);font-size:12px;margin-bottom:2px;padding:8px 6px}
.slot.live{border-color:#f1d58e;color:#f1d58e;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{background:rgba(241,213,142,.12)}}
.dock{position:fixed;bottom:12px;left:12px;right:12px;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:760px;margin:0 auto}
.intro .spine{animation:slidein .5s calc(var(--i) * 25ms + 150ms) both}
@keyframes slidein{from{transform:translateY(40px);opacity:0}}
/* table */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:var(--chip);font-weight:500;cursor:pointer;user-select:none;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:var(--soft)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.tag.chk{background:#fbefd6;color:#7a5410}
.stars-s{color:var(--gold);letter-spacing:-1px}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:28px;font-family:"Frank Ruhl Libre",serif}
.kpi span{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:160px;border-bottom:1px solid var(--line);padding-top:18px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbars .c i{display:block;width:70%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.vbars .c em{font-style:normal;font-size:12px;color:var(--ink);margin-bottom:3px}
.vlabels{display:flex;gap:6px}.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:4px}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .l{width:120px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .t{flex:1;height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.hbar .v{width:28px;text-align:left;color:var(--muted)}
.goal{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.goal .bar{flex:1 1 200px;height:12px}.goal .bar div{background:var(--bar)}
.goal input{width:80px}
/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(20,12,6,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.dialog{background:var(--panel);border-radius:14px;width:100%;max-width:480px;max-height:92vh;overflow:auto;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}}
.dhead{padding:16px 18px 14px;color:#fff;border-radius:14px 14px 0 0;display:flex;gap:12px;align-items:flex-start}
.dhead.light{color:#2b2420}
.dhead .ht{flex:1;min-width:0}
.dhead h3{margin:0;font-family:"Frank Ruhl Libre",serif;font-size:22px;line-height:1.2}
.dhead .ht div{opacity:.9;margin-top:2px}
.dhead .thumb{width:54px;height:80px;object-fit:cover;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.35);flex:0 0 auto}
.dhead .eb{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:inherit;padding:5px 12px;font-size:13px;border-radius:16px;flex:0 0 auto}
.dhead.light .eb{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2)}
.dbody{padding:14px 18px 18px}
.dbody h3{font-family:"Frank Ruhl Libre",serif;margin:0 0 12px;font-size:21px}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px}
.status{display:flex;flex-wrap:wrap;gap:6px}
.status button{padding:7px 11px;font-size:14px;border-radius:20px;display:flex;align-items:center;gap:6px}
.status button i{width:9px;height:9px;border-radius:50%}
.status button.sel{color:#fff;border-color:transparent}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.field label{font-size:13px;color:var(--muted)}
.stars{display:flex;gap:2px;direction:ltr;justify-content:flex-end}
.stars button{border:0;background:none;font-size:30px;padding:0 2px;color:var(--line);line-height:1}
.stars button.lit{color:var(--gold)}
.stars button:hover{transform:scale(1.15)}
.box{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px}
.editbox{background:var(--soft);border-radius:10px;padding:12px;margin-bottom:6px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.covers{display:flex;gap:10px}
.cov{flex:1;aspect-ratio:2/3;max-height:230px;border-radius:8px;border:2px dashed var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;cursor:pointer;position:relative;overflow:hidden;padding:0}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov .plus{font-size:28px;line-height:1}
.cov.has{border-style:solid;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.cov .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px}
.busy-over{position:relative}
.busy-over:after{content:attr(data-busy);position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 88%,transparent);display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:8px;font-size:14px}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(20,12,6,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.viewer img{max-width:100%;max-height:78vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.viewer .va{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.shelfrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}.shelfrow .grow{flex:1}
.warnbox{background:#fbefd6;color:#4a3410;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.pick{text-align:center;padding:24px 18px}
.pick .big{font-family:"Frank Ruhl Libre",serif;font-size:26px;min-height:70px;display:flex;align-items:center;justify-content:center}
.pick .who{color:var(--muted);min-height:22px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:24px;z-index:70;transition:transform .25s;font-size:14px;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;padding:0 4px}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* splash */
#splash{position:fixed;inset:0;z-index:100;perspective:1600px;overflow:hidden}
#splash .door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#6b4729,#8d6340 8%,#9a6e47 50%,#8d6340 92%,#6b4729);transition:transform 1.1s cubic-bezier(.6,.05,.3,1);box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
#splash .door:before{content:"";position:absolute;inset:7% 12%;border:3px solid rgba(60,35,15,.45);border-radius:6px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.06),inset 0 0 24px rgba(0,0,0,.25)}
#splash .door:after{content:"";position:absolute;top:74%;width:14px;height:44px;border-radius:7px;background:linear-gradient(#f1d58e,#b88a2e);box-shadow:0 2px 4px rgba(0,0,0,.45)}
#splash .dl{left:0;transform-origin:left center}#splash .dl:after{right:5%}
#splash .dr{right:0;transform-origin:right center}#splash .dr:after{left:5%}
#splash.open .dl{transform:rotateY(100deg)}#splash.open .dr{transform:rotateY(-100deg)}
#splash.open{pointer-events:none}
.sp-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff6e6;padding:24px;transition:opacity .4s;z-index:2}
#splash.open .sp-in{opacity:0}
.sp-books{display:flex;align-items:flex-end;gap:4px;height:120px;margin-bottom:18px;padding:0 14px;border-bottom:8px solid #5a3b22}
.sp-books i{width:22px;border-radius:3px 3px 0 0;transform:translateY(-140px);opacity:0;animation:drop .6s cubic-bezier(.3,1.4,.5,1) forwards;box-shadow:inset -3px 0 0 rgba(0,0,0,.2)}
@keyframes drop{to{transform:none;opacity:1}}
.sp-in h2{font-family:"Frank Ruhl Libre",serif;font-size:42px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.4);animation:fadeup .7s .6s both}
.sp-in p{margin:8px 0 0;font-size:17px;opacity:.92;animation:fadeup .7s .9s both;max-width:420px;min-height:1.4em}
.sp-in button{margin-top:26px;font-size:18px;padding:12px 30px;border-radius:30px;border:0;background:linear-gradient(#f1d58e,#c99a3c);color:#3b2a16;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:fadeup .7s 1.2s both,pulse 2s 2.2s infinite}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
@keyframes pulse{50%{box-shadow:0 4px 14px rgba(0,0,0,.35),0 0 0 10px rgba(241,213,142,.25)}}
.ro .edit-only{display:none!important}
@media (max-width:640px){h1{font-size:20px}.hide-sm{display:none!important}.card{flex-basis:220px}.cabinet{padding:12px 8px 8px}main{padding:12px 8px 90px}.hbar .l{width:96px}.tabs button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script>
(function(){
"use strict";
/* ---------- constants & helpers ---------- */
const ST={shelf:{l:'על המדף',c:'#8a7f73'},reading:{l:'בקריאה',c:'#2f7fbf'},read:{l:'קראתי',c:'#3d8a3a'},want:{l:'רוצה לקרוא',c:'#b5547a'},lent:{l:'השאלתי',c:'#d08a12'},borrowed:{l:'שאול - להחזיר',c:'#c0442f'},given:{l:'מסרתי',c:'#7b6b9a'}};
const OUT=['lent','borrowed','given'];
const PALETTE=['#7a2e2a','#2f4f6f','#3d5c3a','#5b3b6b','#8a5a1f','#1f5e5e','#6b2f45','#3f3f3f','#9c4a1a','#24476b','#5e6b2a','#7d6b55','#e8dcc4','#d9c7a0','#c9d6c8','#a33a2c'];
const LIGHT=new Set(['#e8dcc4','#d9c7a0','#c9d6c8']);
const MONTHS=['ינו','פבר','מרץ','אפר','מאי','יוני','יולי','אוג','ספט','אוק','נוב','דצמ'];
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=d=>d?d.split('-').reverse().join('.'):'';
const starsTxt=n=>n?'★'.repeat(n):'';
// search normalization: niqqud, geresh/quotes, double yod/vav, punctuation
const norm=s=>String(s||'').toLowerCase().replace(/[֑-ׇ]/g,'').replace(/["'`׳״.,:;!?()\[\]\-–—_\/]/g,' ').replace(/יי/g,'י').replace(/וו/g,'ו').replace(/\s+/g,' ').trim();
const FIELDS={title:'',author:'',shelf:'',pos:0,notes:'',check:false,status:'shelf',person:'',due:'',rating:0,review:'',page:0,pages:0,started:'',finished:'',front:'',back:'',tags:[]};
const clean=o=>{const r={};for(const k in FIELDS)r[k]=o[k]===undefined?(Array.isArray(FIELDS[k])?[]:FIELDS[k]):o[k];return r};

const colorOf=b=>PALETTE[hash(b.author+'|'+b.shelf)%PALETTE.length];
const onShelf=id=>books.filter(b=>b.shelf===id&&b.status!=='want').sort((a,b)=>a.pos-b.pos);

const queues={};let inflight=0;
function setSave(state,txt){const d=document.getElementById('dot'),t=document.getElementById('savetxt');if(!d)return;d.className='dot'+(state?' '+state:'');t.textContent=txt||''}
function enqueue(key,fn){
  inflight++;setSave('busy','שומר...');
  queues[key]=(queues[key]||Promise.resolve()).then(fn).then(()=>{},onWriteError).finally(()=>{if(--inflight===0)setSave('','נשמר')});
  return queues[key];
}
function onWriteError(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'){canWrite=false;document.body.classList.add('ro');toast('אין לך הרשאה לשנות את הארון - מצב צפייה');render()}
  else if(c==='quota_exceeded'){toast('האחסון של הארון מלא')}
  else{setSave('err','השמירה נכשלה');toast('השמירה נכשלה - נסה שוב')}
  throw e;
}
function writeBook(id,data){ // full set
  const b=clean(data);
  const i=books.findIndex(x=>x.id===id);if(i<0)books.push(Object.assign({id},b));else books[i]=Object.assign({id},b);
  if(memMode)return Promise.resolve();
  return enqueue('b/'+id,()=>db.collection('books').doc(id).set(b)).catch(()=>{});
}
function patchBook(id,patch){
  const b=byId(id);if(!b)return;Object.assign(b,patch);
  if(memMode)return Promise.resolve();
  return enqueue('b/'+id,()=>db.collection('books').doc(id).update(patch)).catch(()=>{});
}
function removeBook(id){
  books=books.filter(b=>b.id!==id);
  if(memMode)return Promise.resolve();
  return enqueue('b/'+id,()=>db.collection('books').doc(id).delete()).catch(()=>{});
}
function saveMeta(){
  if(memMode)return Promise.resolve();
  const m={shelves:meta.shelves.map(s=>({id:s.id})),goal:meta.goal||0};
  return enqueue('meta',()=>db.doc('meta/main').set(m)).catch(()=>{});
}

let toastTimer;

function confetti(){const cs=['#e9b23a','#8c3b2a','#2f7fbf','#3d8a3a','#c0662e'];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%5];d.style.animationDuration=1.6+Math.random()*1.6+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}

/* ---------- filtering ---------- */
function matches(b){
  if(fShelf&&b.shelf!==fShelf)return false;
  if(fTag&&!(b.tags||[]).includes(fTag))return false;
  if(fStatus==='check'){if(!b.check)return false}
  else if(fStatus==='rated'){if(!b.rating)return false}
  else if(fStatus&&b.status!==fStatus)return false;
  if(q){const n=norm(q);if(!norm(`${b.title} ${b.author} ${b.notes} ${b.person} ${b.review} ${(b.tags||[]).join(' ')}`).includes(n))return false}
  return true;
}

/* ---------- render ---------- */
function render(){
  if(!memMode&&!(loaded.books&&loaded.meta))return;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));

      if(chk&&canWrite)html+=`<div class="note edit-only"><span>${chk} ספרים זוהו מהתמונות בחוסר ודאות (נקודה כתומה בראש השדרה). כדאי לעבור עליהם ולתקן.</span><button data-f="check">הצג אותם</button></div>`;
    }
    if(view==='shelves'){
      if(arrange)html+=`<div class="note dock"><span>${moving?'עכשיו לחץ על ספר כדי להניח לפניו את הספר שבחרת, או על "לסוף המדף".':'מצב סידור: לחץ על ספר כדי להזיז אותו. ליד כל מדף יש חצים להזזת המדף וכפתורי מיון.'}</span><button class="primary" id="arrDone">סיום סידור</button></div>`;
      const shelfBooks=list.filter(b=>b.status!=='want');

        const orphan=shelfBooks.filter(x=>shelfIdx(x.shelf)<0);

        html+='<div class="cabinet">'+groups.filter(g=>g.b.length||arrange).map(g=>`<section class="shelf"><div class="shead"><span class="plaque">${g.i<0?'ללא מדף':'מדף '+(g.i+1)} <small>${g.b.length} ספרים</small></span>${arrange&&g.i>=0?`<button data-sh="${g.i}" data-d="-1"${g.i===0?' disabled':''} aria-label="העלאת המדף">▲</button><button data-sh="${g.i}" data-d="1"${g.i===N-1?' disabled':''} aria-label="הורדת המדף">▼</button><button data-sort="${g.s.id}" data-k="author">מיון לפי סופר</button><button data-sort="${g.s.id}" data-k="title">לפי שם</button>`:''}</div><div class="rack">${g.b.map((b,i)=>spine(b,i)).join('')}${arrange&&g.i>=0?`<button class="slot${moving?' live':''}" data-end="${g.s.id}">לסוף המדף</button>`:''}${!g.b.length&&!arrange?'':''}</div><div class="board"></div></section>`).join('')+'</div><div class="cabinet-feet"><i></i><i></i></div>';

function renderChips(){
  const cnt=k=>books.filter(b=>b.status===k).length;
  const rated=books.filter(b=>b.rating),avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):null;
  const chk=books.filter(b=>b.check).length;
  let h=`<div class="chips"><div class="chip${!fStatus?' on':''}" data-f=""><b>${books.filter(b=>b.status!=='want').length}</b> ספרים בארון</div>`;
  for(const k in ST){const n=cnt(k);if(n||k==='reading'||k==='read')h+=`<div class="chip${fStatus===k?' on':''}" data-f="${k}"><i style="background:${ST[k].c}"></i><b>${n}</b> ${ST[k].l}</div>`}
  if(rated.length)h+=`<div class="chip${fStatus==='rated'?' on':''}" data-f="rated"><span class="stars-s">★</span><b>${avg}</b> ממוצע (${rated.length})</div>`;
  if(chk)h+=`<div class="chip edit-only${fStatus==='check'?' on':''}" data-f="check"><i style="background:var(--warn)"></i><b>${chk}</b> לבדיקה</div>`;
  h+='</div>';
  const tags={};books.forEach(b=>(b.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1));
  const tk=Object.keys(tags).sort((a,b)=>tags[b]-tags[a]);
  if(tk.length)h+=`<div class="chips">${tk.map(t=>`<span class="tagchip${fTag===t?' on':''}" data-tag="${esc(t)}">${esc(t)} ${tags[t]}</span>`).join('')}</div>`;
  return h;
}
function renderTable(list){
  if(!list.length)return '<div class="empty">לא נמצאו ספרים</div>';
  const cols=[['title','שם הספר'],['author','סופר/ת'],['status','סטטוס'],['rating','דירוג'],['shelf','מדף']];
  const val=(b,k)=>k==='shelf'?(b.status==='want'?'ת':String(shelfIdx(b.shelf)+100)):k==='status'?ST[b.status].l:k==='rating'?String(9-b.rating):b[k]||'';
  const sorted=[...list].sort((a,b)=>val(a,sortKey).localeCompare(val(b,sortKey),'he')*sortDir||a.title.localeCompare(b.title,'he'));
  return `<table><thead><tr>${cols.map(([k,l])=>`<th data-col="${k}"${k==='shelf'?' class="hide-sm"':''}>${l}${sortKey===k?(sortDir>0?' ▴':' ▾'):''}</th>`).join('')}</tr></thead><tbody>${sorted.map(b=>`<tr class="row" data-id="${b.id}"><td>${esc(b.title)} ${b.check?'<span class="tag chk">לבדיקה</span>':''}</td><td>${esc(b.author)}</td><td><span class="tag" style="background:${ST[b.status].c}">${ST[b.status].l}</span>${b.person?' <small>'+esc(b.person)+'</small>':''}</td><td class="stars-s">${starsTxt(b.rating)}</td><td class="hide-sm">${b.status==='want'?'':esc(shelfName(b.shelf))}</td></tr>`).join('')}</tbody></table>`;
}
function card(b){
  let extra='';
  if(b.status==='reading'){const p=b.pages?Math.min(100,Math.round(100*(b.page||0)/b.pages)):0;extra=b.pages?`<div class="bar"><div style="width:${p}%"></div></div><div class="a">עמוד ${b.page||0} מתוך ${b.pages} (${p}%)</div>`:`<div class="a">${b.started?'התחלתי ב-'+fmtDate(b.started):'לחץ לעדכון התקדמות'}</div>`}
  else if(b.status==='want'){extra=b.notes?`<div class="a">${esc(b.notes)}</div>`:''}
  else{extra=`<div class="a"><span class="tag" style="background:${ST[b.status].c}">${ST[b.status].l}</span> ${esc(b.person||'')}</div>${b.due?`<div class="${overdue(b)?'alert':'a'}">${overdue(b)?'באיחור - ':''}להחזרה עד ${fmtDate(b.due)}</div>`:''}`}
  return `<div class="card" data-id="${b.id}"><div class="mini" style="background-color:${colorOf(b)}${b.front?`;background-image:url('${coverUrl(b.front)}')`:''}"></div><div style="min-width:0;flex:1"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>${extra}</div></div>`;
}
function spine(b,i){
  const c=colorOf(b),h=180+hash(b.title)%70,w=34+hash(b.author+b.title)%12;
  return `<button class="spine${LIGHT.has(c)?' light':''}${b.status==='given'?' ghost':''}${b.status==='reading'&&!arrange?' reading':''}${moving===b.id?' sel':''}" style="background-color:${c};height:${h}px;width:${w}px;--i:${i||0}" data-id="${b.id}" title="${esc(b.title)} - ${esc(b.author)} (${ST[b.status].l})"><b>${esc(b.title)}</b><span>${esc(b.author)}</span>${b.status!=='shelf'?`<i class="rib" style="background:${ST[b.status].c}"></i>`:''}${b.rating?`<i class="st">${starsTxt(b.rating)}</i>`:''}${b.check?'<i class="flag"></i>':''}</button>`;
}

/* ---------- stats ---------- */
function renderStats(){
  const owned=books.filter(b=>b.status!=='want');
  const read=books.filter(b=>b.status==='read');
  const yr=new Date().getFullYear();
  const readYear=read.filter(b=>(b.finished||'').startsWith(yr+'')).length;
  const rated=books.filter(b=>b.rating);
  const avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):'-';
  let h=`<div class="kpis"><div class="kpi"><b>${owned.length}</b><span>ספרים בארון</span></div><div class="kpi"><b>${read.length}</b><span>קראתי</span></div><div class="kpi"><b>${books.filter(b=>b.status==='reading').length}</b><span>בקריאה עכשיו</span></div><div class="kpi"><b>${avg}</b><span>דירוג ממוצע (${rated.length} ספרים)</span></div></div>`;
  const goal=meta.goal||0,pct=goal?Math.min(100,Math.round(100*readYear/goal)):0;
  h+=`<div class="panel"><h3>יעד קריאה ל-${yr}</h3><div class="sub">${goal?`קראת ${readYear} מתוך ${goal} ספרים (${pct}%)`:'עוד לא הוגדר יעד. כמה ספרים תרצה לקרוא השנה?'}</div><div class="goal"><div class="bar"><div style="width:${pct}%"></div></div><label class="edit-only">יעד: <input type="number" min="0" id="goalIn" value="${goal||''}"></label></div></div>`;
  // finished per month, last 12 months
  const now=new Date(),months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:MONTHS[d.getMonth()]})}
  months.forEach(m=>m.n=read.filter(b=>(b.finished||'').startsWith(m.k)).length);
  const mx=Math.max(1,...months.map(m=>m.n));
  h+=`<div class="grid2"><div class="panel"><h3>ספרים שסיימתי בכל חודש</h3><div class="sub">12 החודשים האחרונים, לפי תאריך הסיום</div><div class="vbars">${months.map(m=>`<div class="c" title="${m.l}: ${m.n} ספרים">${m.n?`<em>${m.n}</em>`:''}<i style="height:${m.n/mx*100}%"></i></div>`).join('')}</div><div class="vlabels">${months.map(m=>`<span>${m.l}</span>`).join('')}</div></div>`;
  const rd=[5,4,3,2,1].map(n=>({l:starsTxt(n),n:rated.filter(b=>b.rating===n).length}));
  h+=`<div class="panel"><h3>איך דירגתי</h3><div class="sub">מספר הספרים בכל דירוג</div>${hbars(rd,'stars-s')}</div>`;
  const au={};owned.forEach(b=>{if(b.author&&b.author!=='לא מזוהה')au[b.author]=(au[b.author]||0)+1});
  const top=Object.entries(au).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,n])=>({l,n}));
  h+=`<div class="panel"><h3>הסופרים הנפוצים בארון</h3><div class="sub">לפי מספר הספרים</div>${hbars(top)}</div>`;
  const sd=Object.keys(ST).map(k=>({l:ST[k].l,n:books.filter(b=>b.status===k).length})).filter(x=>x.n);
  h+=`<div class="panel"><h3>מצב הספרים</h3><div class="sub">כל הספרים, כולל רשימת "רוצה לקרוא"</div>${hbars(sd)}</div></div>`;
  return h;
}
function hbars(rows,lc){const mx=Math.max(1,...rows.map(r=>r.n));return rows.map(r=>`<div class="hbar" title="${esc(r.l)}: ${r.n}"><span class="l ${lc||''}">${esc(r.l)}</span><span class="t"><i style="width:${r.n/mx*100}%"></i></span><span class="v">${r.n}</span></div>`).join('')}

/* ---------- covers ---------- */
const tmpUrls={};
const coverUrl=id=>tmpUrls[id]||('/_blob/'+id);
async function shrink(file){
  let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('הקובץ אינו תמונה'));im.src=URL.createObjectURL(file)})}
  const max=1400,k=Math.min(1,max/Math.max(src.width,src.height));
  const cv=document.createElement('canvas');cv.width=Math.round(src.width*k);cv.height=Math.round(src.height*k);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
}
async function uploadBlob(blob){
  if(!assets){const id='tmp-'+uid();tmpUrls[id]=URL.createObjectURL(blob);return id}
  const r=await assets.upload(blob);return r.id;
}
function dropAsset(id){if(id&&assets&&!String(id).startsWith('tmp-'))assets.delete(id).catch(()=>{})}
function pickImage(){return new Promise(res=>{const f=$('covFile');f.value='';f.onchange=()=>res(f.files[0]||null);f.click()})}
function showCover(b,k,onRemove,onReplace){
  const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<img src="${coverUrl(b[k])}" alt="${k==='front'?'כריכה קדמית':'כריכה אחורית'}"><div class="va">${b.front&&b.back?`<button id="vFlip">${k==='front'?'לכריכה האחורית':'לכריכה הקדמית'}</button>`:''}${canWrite?'<button id="vRep">החלפת תמונה</button><button class="danger" id="vDel">הסרה</button>':''}<button class="primary" id="vClose">סגירה</button></div>`;
  document.body.appendChild(v);
  const shut=()=>v.remove();
  v.onclick=e=>{if(e.target===v)shut()};
  v.querySelector('#vClose').onclick=shut;
  const fl=v.querySelector('#vFlip');if(fl)fl.onclick=()=>{shut();showCover(b,k==='front'?'back':'front',onRemove,onReplace)};

/* ---------- book dialog ---------- */
function openBook(id,preset){
  const isNew=!id;
  // draft holds edits for a new book; for an existing book we patch live
  const draft=isNew?Object.assign(clean({}),{shelf:fShelf||(meta.shelves[0]||{}).id||'',status:'shelf'},preset||{}):null;
  const newAssets=[];let editing=false,dupOk=false;
  const B=()=>isNew?draft:byId(id);
  const set=(patch,redraw)=>{if(isNew)Object.assign(draft,patch);else patchBook(id,patch);if(redraw!==false)draw();if(!isNew)render()};
  const ro=canWrite?'':' disabled';
  const draw=()=>{
    const b=B();if(!b){close();return}
    const c=colorOf(b);let ctx='';

    if(OUT.includes(b.status))ctx=`<div class="box"><div class="row2"><div class="field"><label for="fPerson">${b.status==='borrowed'?'ממי שאלתי':b.status==='lent'?'למי השאלתי':'למי מסרתי'}</label><input id="fPerson" value="${esc(b.person)}"${ro}></div>${b.status!=='given'?`<div class="field"><label for="fDue">להחזרה עד</label><input type="date" id="fDue" value="${b.due||''}"${ro}></div>`:''}</div>${overdue(b)?'<div class="alert">ההחזרה באיחור</div>':''}</div>`;

    <div class="dbody">
    ${isNew&&sample?`<button id="aiBtn" style="width:100%;margin-bottom:10px">צילום כריכה וזיהוי אוטומטי של הספר</button>`:''}

    ${ctx}

    </div>`;

  const wire=b=>{
    $('dlg').querySelectorAll('[data-s]').forEach(bt=>bt.onclick=()=>{
      const k=bt.dataset.s;if(k===b.status)return;const prev=b.status,p={status:k};

      if(prev==='want'&&k!=='want'&&shelfIdx(b.shelf)<0&&meta.shelves.length){p.shelf=meta.shelves[0].id;p.pos=nextPos(meta.shelves[0].id)}

    });

    const bind=(elId,key,kind,redraw)=>{const el=$(elId);if(!el)return;el.onchange=()=>{let v=el.value;if(kind==='num')v=+v||0;else if(kind==='tags')v=[...new Set(v.split(/[,،]/).map(s=>s.trim()).filter(Boolean))];else v=v.trim();if(JSON.stringify(v)===JSON.stringify(b[key]))return;const p={[key]:v};if(key==='shelf'&&!isNew)p.pos=nextPos(v);set(p,redraw)}};
    bind('fPage','page','num',true);bind('fPages','pages','num',true);bind('fPerson','person','',false);bind('fDue','due','',true);bind('fReview','review','',false);

    if($('aiBtn'))$('aiBtn').onclick=identify;
    $('cancel').onclick=()=>{if(isNew)newAssets.forEach(dropAsset);close()};
    if($('ok'))$('ok').onclick=()=>{
      syncNewFields();
      if(!draft.title){$('eT').focus();return}
      const dup=books.find(x=>norm(x.title)===norm(draft.title));
      if(dup&&!dupOk){dupOk=true;$('dupWarn').innerHTML=`<div class="warnbox">כבר יש בארון ספר בשם הזה (${esc(dup.author)}, ${dup.status==='want'?'ברשימת רוצה לקרוא':esc(shelfName(dup.shelf))}). ללחוץ שוב על "הוספה לארון" כדי להוסיף בכל זאת.</div>`;return}
      draft.author=draft.author||'לא ידוע';draft.pos=nextPos(draft.shelf);
      const nid='b'+uid();writeBook(nid,draft);close();render();toast('הספר נוסף לארון',()=>{removeBook(nid);newAssets.forEach(dropAsset);render()});
    };
    if($('del'))$('del').onclick=()=>{const snap=Object.assign({},b);removeBook(id);close();render();
      toast(`"${b.title}" נמחק`,()=>{writeBook(id,snap);render()});
      setTimeout(()=>{if(!byId(id)){dropAsset(snap.front);dropAsset(snap.back)}},8000)};
  };
  const syncNewFields=()=>{if(!isNew)return;const g=i=>$(i)?$(i).value.trim():'';if($('eT'))Object.assign(draft,{title:g('eT'),author:g('eA'),shelf:$('eS')?$('eS').value:draft.shelf,notes:g('eN'),tags:[...new Set(g('eG').split(/[,،]/).map(s=>s.trim()).filter(Boolean))],check:$('eC')?$('eC').checked:false});if($('fReview'))draft.review=$('fReview').value.trim()};
  async function uploadCover(k){
    const f=await pickImage();if(!f)return;syncNewFields();
    const slot=$('dlg').querySelector(`[data-cov="${k}"]`);if(slot){slot.classList.add('busy-over');slot.dataset.busy='מעלה...'}
    try{const blob=await shrink(f);const aid=await uploadBlob(blob);const old=B()[k];if(isNew)newAssets.push(aid);set({[k]:aid});if(old)dropAsset(old);toast(assets?'התמונה נשמרה':'בתצוגה הזו התמונה לא תישמר')}
    catch(err){if(slot)slot.classList.remove('busy-over');toast('העלאת התמונה נכשלה')}
  }
  function removeCover(k){const old=B()[k];set({[k]:''});if(isNew)dropAsset(old);else toast('התמונה הוסרה',()=>{set({[k]:old})});if(!isNew)setTimeout(()=>{const cur=B();if(cur&&cur[k]!==old)dropAsset(old)},8000)}
  async function identify(){
    const f=await pickImage();if(!f)return;syncNewFields();
    const bt=$('aiBtn');bt.disabled=true;bt.textContent='מזהה את הספר...';
    try{
      const blob=await shrink(f);
      const lim=sample.limits?await sample.limits():{images:true};
      let res={};
      if(lim&&lim.images){
        res=await sample.json('זו תמונה של כריכת ספר (קדמית או שדרה). זהה את שם הספר ואת שם הסופר כפי שהם כתובים על הכריכה, בשפה המקורית שעל הכריכה (בדרך כלל עברית). אל תנחש: אם משהו לא קריא, השאר מחרוזת ריקה. החזר JSON בלבד בצורה {"title":"...","author":"...","confident":true|false}.',{images:[blob],modelTier:'default'});
      }
      const aid=await uploadBlob(blob);newAssets.push(aid);
      const p={front:aid};
      if(res&&res.title)p.title=String(res.title).trim();
      if(res&&res.author)p.author=String(res.author).trim();
      if(res&&res.title&&res.confident===false)p.check=true;
      set(p);
      toast(res&&res.title?'זיהיתי את הספר - כדאי לוודא שהפרטים נכונים':'לא הצלחתי לזהות, אפשר להקליד ידנית');
    }catch(e){bt.disabled=false;bt.textContent='צילום כריכה וזיהוי אוטומטי של הספר';toast(e&&e.code==='rate_limited'?'יותר מדי בקשות, נסה שוב בעוד רגע':'הזיהוי לא הצליח, אפשר להקליד ידנית')}
  }
  draw();$('ov').classList.add('open');
  if(isNew&&$('eT'))$('eT').focus();
}

/* ---------- pick a book ---------- */
function openPick(){
  const pool=books.filter(b=>b.status==='shelf'&&(!fShelf||b.shelf===fShelf));
  if(!pool.length){toast('אין ספרים שעוד לא נקראו');return}
  $('dlg').innerHTML=`<div class="pick"><div class="lbl">הארון בוחר בשבילך...</div><div class="big" id="pT"></div><div class="who" id="pA"></div><div class="actions" style="justify-content:center"><button id="again">ספר אחר</button><button class="primary edit-only" id="start" disabled>להתחיל לקרוא</button><button id="cancel">סגירה</button></div></div>`;
  $('ov').classList.add('open');
  let chosen;
  const spin=()=>{$('start').disabled=true;let i=0;const tick=()=>{chosen=pool[Math.floor(Math.random()*pool.length)];$('pT').textContent=chosen.title;$('pA').textContent=chosen.author;if(++i<14)setTimeout(tick,40+i*i*2);else{$('pA').textContent=chosen.author+' · '+shelfName(chosen.shelf);$('start').disabled=false}};tick()};
  $('again').onclick=spin;$('cancel').onclick=close;
  $('start').onclick=()=>{patchBook(chosen.id,{status:'reading',started:chosen.started||today()});render();toast('קריאה מהנה!');openBook(chosen.id)};
  spin();
}

/* ---------- shelves dialog ---------- */
function openShelves(){
  const draw=()=>{$('dlg').innerHTML=`<div class="dbody"><h3>ניהול מדפים</h3>${meta.shelves.map((s,i)=>`<div class="shelfrow"><span class="grow">מדף ${i+1} <small style="color:var(--muted)">${onShelf(s.id).length} ספרים</small></span><button data-up="${i}" aria-label="העברה למעלה"${i===0?' disabled':''}>▲</button><button data-dn="${i}" aria-label="העברה למטה"${i===meta.shelves.length-1?' disabled':''}>▼</button><button class="danger" data-rm="${i}" aria-label="מחיקת המדף">✕</button></div>`).join('')}
  <button id="addShelf">מדף חדש</button><div class="actions"><span class="grow"></span><button class="primary" id="done">סיום</button></div></div>`;
  const swap=(i,j)=>{[meta.shelves[i],meta.shelves[j]]=[meta.shelves[j],meta.shelves[i]];saveMeta();draw();render()};
  $('dlg').querySelectorAll('[data-up]').forEach(bt=>bt.onclick=()=>swap(+bt.dataset.up,+bt.dataset.up-1));
  $('dlg').querySelectorAll('[data-dn]').forEach(bt=>bt.onclick=()=>swap(+bt.dataset.dn,+bt.dataset.dn+1));
  $('dlg').querySelectorAll('[data-rm]').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.rm,s=meta.shelves[i],n=onShelf(s.id).length;
    if(n&&!bt.dataset.sure){bt.dataset.sure=1;bt.textContent=`${n} ספרים יעברו ל"ללא מדף" - שוב לאישור`;return}
    meta.shelves.splice(i,1);saveMeta();draw();render();toast('המדף נמחק',()=>{meta.shelves.splice(i,0,s);saveMeta();render()})});
  $('addShelf').onclick=()=>{meta.shelves.push({id:'s'+uid()});saveMeta();draw();render()};
  $('done').onclick=close;};
  draw();$('ov').classList.add('open');
}
function close(){$('ov').classList.remove('open');render()}

/* ---------- arrange ---------- */
function setArrange(on){arrange=on;moving=null;if(on){view='shelves';q='';fStatus='';fShelf='';fTag='';$('q').value=''}render()}
function placeBook(id,beforeId,endShelf){
  const b=byId(id);if(!b)return;const old={shelf:b.shelf,pos:b.pos};let p;
  if(beforeId){const t=byId(beforeId);const l=onShelf(t.shelf).filter(x=>x.id!==id);const i=l.indexOf(t);const prev=l[i-1];p={shelf:t.shelf,pos:prev?(prev.pos+t.pos)/2:t.pos-1000};
    if(prev&&Math.abs(t.pos-prev.pos)<1e-6){renumber(t.shelf);return placeBook(id,beforeId)}}
  else{const l=onShelf(endShelf).filter(x=>x.id!==id);p={shelf:endShelf,pos:l.length?l[l.length-1].pos+1000:1000}}
  moving=null;patchBook(id,p);render();toast('הספר הועבר',()=>{patchBook(id,old);render()});
}
function renumber(sid){onShelf(sid).forEach((b,i)=>{const p=(i+1)*1000;if(b.pos!==p)patchBook(b.id,{pos:p})})}
function sortShelf(sid,key){
  const l=onShelf(sid);const old=l.map(b=>[b.id,b.pos]);
  [...l].sort((a,b)=>(a[key]||'').localeCompare(b[key]||'','he')||a.title.localeCompare(b.title,'he')).forEach((b,i)=>{const p=(i+1)*1000;if(b.pos!==p)patchBook(b.id,{pos:p})});
  render();toast(key==='author'?'המדף מוין לפי סופר':'המדף מוין לפי שם',()=>{old.forEach(([id,p])=>{const b=byId(id);if(b&&b.pos!==p)patchBook(id,{pos:p})});render()});
}
function moveShelf(i,d){const j=i+d;if(j<0||j>=meta.shelves.length)return;[meta.shelves[i],meta.shelves[j]]=[meta.shelves[j],meta.shelves[i]];saveMeta();render()}

/* ---------- backup ---------- */
async function exportBackup(){
  const data=JSON.stringify({app:'bookshelf',version:2,exported:new Date().toISOString(),meta:{shelves:meta.shelves,goal:meta.goal||0},books:books.map(b=>Object.assign({id:b.id},clean(b)))},null,1);
  const name='גיבוי-ארון-ספרים-'+today()+'.json';
  if(downloads){try{await downloads.save({filename:name,data});toast('הגיבוי נשמר');return}catch(e){if(e&&e.code==='declined')return}}
  $('dlg').innerHTML=`<div class="dbody"><h3>גיבוי הארון</h3><p style="color:var(--muted);font-size:14px">אפשר להעתיק את הטקסט ולשמור אותו כקובץ.</p><textarea id="bk" rows="8" style="width:100%;direction:ltr;font-size:11px" readonly></textarea><div class="actions"><span class="grow"></span><button id="cp">העתקה</button><button class="primary" id="cancel">סגירה</button></div></div>`;
  $('bk').value=data;$('ov').classList.add('open');$('cancel').onclick=close;
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(data);toast('הועתק')}catch(e){$('bk').select();toast('סמן והעתק ידנית')}};
}
function importBackup(){
  const f=$('impFile');f.value='';f.onchange=async()=>{
    const file=f.files[0];if(!file)return;let d;
    try{d=JSON.parse(await file.text());if(!d||!Array.isArray(d.books)||!d.meta)throw 0}catch(e){toast('הקובץ אינו גיבוי תקין של הארון');return}
    $('dlg').innerHTML=`<div class="dbody"><h3>ייבוא מגיבוי</h3><p>בגיבוי יש ${d.books.length} ספרים ו-${(d.meta.shelves||[]).length} מדפים. הייבוא יחליף את כל מה שיש עכשיו בארון (${books.length} ספרים).</p><div class="actions"><span class="grow"></span><button id="cancel">ביטול</button><button class="primary" id="go">להחליף</button></div></div>`;
    $('ov').classList.add('open');$('cancel').onclick=close;
    $('go').onclick=async()=>{
      const bt=$('go');bt.disabled=true;
      meta={shelves:(d.meta.shelves||[]).map(s=>({id:String(s.id)})),goal:+d.meta.goal||0};saveMeta();
      const keep=new Set(d.books.map(b=>String(b.id)));
      const old=books.filter(b=>!keep.has(b.id)).map(b=>b.id);
      let n=0;for(const b of d.books){writeBook(String(b.id),b);if(++n%10===0){bt.textContent=`מייבא... ${n}/${d.books.length}`;await new Promise(r=>setTimeout(r,50))}}
      old.forEach(removeBook);
      close();toast('הארון שוחזר מהגיבוי');
    };
  };f.click();
}

  else if(k==='import')importBackup();
  else if(k==='dark'){const on=document.body.classList.toggle('dark');$('darkBtn').textContent=on?'מצב בהיר':'מצב כהה';try{localStorage.setItem('shelf-dark',on?'1':'0')}catch(err){}}};
$('ov').onclick=e=>{if(e.target.id==='ov')close()};
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const v=document.querySelector('.viewer');if(v){v.remove();return}if($('ov').classList.contains('open'))close();else if(arrange)setArrange(false)});
$('main').addEventListener('change',e=>{if(e.target.id==='goalIn'){meta.goal=Math.max(0,+e.target.value||0);saveMeta();render()}});
$('main').onclick=e=>{
  const t=e.target;
  if(t.id==='arrDone'){setArrange(false);toast('הסידור נשמר');return}
  const f=t.closest('[data-f]');if(f){fStatus=fStatus===f.dataset.f&&f.dataset.f?'':f.dataset.f;render();return}
  const tg=t.closest('[data-tag]');if(tg){fTag=fTag===tg.dataset.tag?'':tg.dataset.tag;render();return}
  const sh=t.closest('[data-sh]');if(sh){moveShelf(+sh.dataset.sh,+sh.dataset.d);return}
  const so=t.closest('[data-sort]');if(so){sortShelf(so.dataset.sort,so.dataset.k);return}
  const en=t.closest('[data-end]');if(en){if(moving)placeBook(moving,null,en.dataset.end);else toast('קודם בחר ספר');return}
  const th=t.closest('th[data-col]');if(th){if(sortKey===th.dataset.col)sortDir*=-1;else{sortKey=th.dataset.col;sortDir=1}render();return}
  const sp=t.closest('[data-id]');if(!sp)return;
  if(arrange&&sp.classList.contains('spine')){const id=sp.dataset.id;if(!moving)moving=id;else if(moving===id)moving=null;else{placeBook(moving,id);return}render();return}
  openBook(sp.dataset.id);
};

/* ---------- splash ---------- */
let splashLine=null,introShown=false;
(function splash(){
  let seen=false;try{seen=sessionStorage.getItem('shelf-splash')==='1'}catch(e){}
  if(seen)return;
  const cols=['#7a2e2a','#2f4f6f','#e8dcc4','#3d5c3a','#8a5a1f','#5b3b6b','#c9d6c8','#a33a2c','#1f5e5e'];
  const bk=cols.map((c,i)=>`<i style="background:${c};height:${70+(i*37)%50}px;animation-delay:${i*90}ms"></i>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div id="splash"><div class="door dl"></div><div class="door dr"></div><div class="sp-in"><div class="sp-books">${bk}</div><h2>ארון הספרים שלי</h2><p id="spA">פותח את הארון...</p><p id="spB"></p><button id="enter">לפתוח את הארון</button></div></div>`);
  let done=false;
  const open=()=>{if(done)return;done=true;try{sessionStorage.setItem('shelf-splash','1')}catch(e){}
    $('splash').classList.add('open');$('main').classList.add('intro');setTimeout(()=>{introShown=true},50);
    setTimeout(()=>{const s=$('splash');if(s)s.remove()},1200);setTimeout(()=>$('main').classList.remove('intro'),4000)};
  $('enter').onclick=open;
  document.addEventListener('keydown',function k(e){if(e.key==='Enter'||e.key===' '){if($('splash')&&!done){e.preventDefault();open()}document.removeEventListener('keydown',k)}});
  splashLine=()=>{if(!$('spA'))return;const h=new Date().getHours();
    const greet=h>=5&&h<12?'בוקר טוב':h>=12&&h<17?'צהריים טובים':h>=17&&h<21?'ערב טוב':'לילה טוב';
    const owned=books.filter(b=>b.status!=='want').length,reading=books.filter(b=>b.status==='reading'),waiting=books.filter(b=>b.status==='shelf').length,late=books.filter(overdue).length;
    $('spA').textContent=`${greet}. ${owned} ספרים בארון.`;
    let line=reading.length?`אתה באמצע "${reading[0].title}"${reading.length>1?` ועוד ${reading.length-1}`:''}`:`${waiting} ספרים מחכים לך על המדפים`;
    if(late)line+=` · ${late===1?'ספר אחד מחכה':late+' ספרים מחכים'} להחזרה`;
    $('spB').textContent=line};
})();

/* ---------- data wiring ---------- */
function applyBooks(snap){
  books=snap.docs.map(d=>Object.assign({id:d.id},clean(d.data()||{})));
  loaded.books=true;dataArrived();
}
function applyMeta(snap){
  const d=snap.exists?snap.data():null;
  meta={shelves:(d&&Array.isArray(d.shelves)?d.shelves:[]).map(s=>({id:String(s.id)})),goal:(d&&d.goal)||0};
  loaded.meta=true;dataArrived();
}
let loadTimer=null;
function dataArrived(){
  if(loadTimer&&loaded.books&&loaded.meta){clearTimeout(loadTimer);loadTimer=null}
  render();
  if(splashLine)splashLine();
}
function startMemory(seed){
  memMode=true;books=seed.books.map(b=>Object.assign({id:b.id},clean(b)));meta=seed.meta;loaded.books=loaded.meta=true;setSave('off','תצוגה מקדימה - שינויים לא נשמרים');render();if(splashLine)splashLine();
}
async function boot(){
  const demo=document.getElementById('demo');
  if(!(window.claude&&window.claude.use)){if(demo)startMemory(JSON.parse(demo.textContent));else{$('main').innerHTML='<div class="empty">פתח את הארון מהקישור שלו כדי לראות את הספרים.</div>';setSave('off','')}return}
  claude.use('assets').then(a=>{assets=a}).catch(()=>{});
  claude.use('downloads').then(d=>{downloads=d}).catch(()=>{});
  claude.use('sample').then(s=>{sample=s}).catch(()=>{});
  claude.use('user').then(async u=>{if(!u)return;try{const w=await u.can('data.write');if(w===false){canWrite=false;document.body.classList.add('ro');render()}}catch(e){}}).catch(()=>{});
  db=await claude.use('db').catch(()=>null);
  if(!db){if(demo)return startMemory(JSON.parse(demo.textContent));$('main').innerHTML='<div class="empty">אי אפשר לטעון את הארון בתצוגה הזו. פתח אותו מהקישור שלו ובחשבון מחובר.</div>';setSave('off','');return}
  setSave('','מחובר');
  loadTimer=setTimeout(()=>{if(!loaded.books)$('main').innerHTML='<div class="empty">אי אפשר להגיע לנתונים כרגע. בדוק את החיבור לאינטרנט, הארון ימשיך לנסות.</div>';else toast('ייתכן שהנתונים אינם מעודכנים')},10000);
  const err=e=>{if(e&&e.code==='revoked'){$('main').innerHTML='<div class="empty">הגישה לארון הסתיימה.</div>'}else toast('החיבור לנתונים נקטע. רענן את העמוד.')};
  db.collection('books').onSnapshot(applyBooks,err);
  db.doc('meta/main').onSnapshot(applyMeta,err);
}
boot();
})();
</script>
</body>
</html>
